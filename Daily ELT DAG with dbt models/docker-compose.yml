version: '3.8'

services:

  postgres:
    image: postgres:15

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics

    ports:
      - "5432:5432"

  airflow:

    build: .

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./dbt:/opt/dbt

    command: standalone
